[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk"
version = "0.1.0"
description = "Risco de crédito orientado a custo: PD calibrada, perda esperada, score, faixas A–E, API e dashboard."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "Renan Toyoyama" }]
license = { text = "MIT" }
dependencies = [
    # dados e ciência
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "python-calamine>=0.3",
    # modelagem
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "imbalanced-learn>=0.12",
    "shap>=0.46",
    "joblib>=1.4",
    # visualização
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "plotly>=5.24",
    "streamlit>=1.40",
    # API
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pre-commit>=4.0",
    "ipykernel>=6.29",
    "httpx2>=2.16",
    "nbformat>=5.10",
    "nbclient>=0.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "D", "ANN"]
ignore = ["D104", "D107", "N803", "N806"]  # N803/N806: convenção sklearn (X maiúsculo)
unfixable = ["F401"]                        # não apagar imports sozinho

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]
"*.ipynb" = ["D", "ANN", "E402"]
"app/*" = ["D"]
"api/*" = ["B008"]                         # Depends()/Query() em defaults é o padrão do FastAPI

[tool.ruff.lint.isort]
known-first-party = ["credit_risk", "api"]
