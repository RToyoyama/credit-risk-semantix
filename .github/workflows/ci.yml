name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    name: Lint e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instala o uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"

      - name: Ambiente com as versões exatas do lock
        run: |
          uv venv --python 3.11 .venv
          uv pip sync --python .venv/bin/python requirements.lock
          uv pip install --python .venv/bin/python -e . --no-deps

      - name: Lint (ruff)
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

      - name: Testes (inclui API; os do dashboard pulam sem dados locais)
        run: .venv/bin/pytest

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Constrói a imagem
        run: docker build -t credit-risk-semantix:ci .
      - name: Testes dentro do container
        run: docker run --rm credit-risk-semantix:ci pytest -q
